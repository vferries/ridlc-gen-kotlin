# The same gate as .github/workflows/ci.yml, for a GitLab mirror
# (docs/design.md §8, stage K0).
stages:
  - verify

variables:
  JUST_VERSION: "1.38.0"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"

default:
  image: eclipse-temurin:17-jdk
  cache:
    key: gradle
    paths:
      - .gradle-home/caches/
      - .gradle-home/wrapper/
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl git unzip > /dev/null
    - mkdir -p "$HOME/.local/bin" && export PATH="$HOME/.local/bin:$PATH"
    - curl -fsSL "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C "$HOME/.local/bin" just

jvm:
  stage: verify
  script:
    - curl -fsSL https://raw.githubusercontent.com/driftsys/prim/main/install.sh | PRIM_INSTALL_DIR="$HOME/.local/bin" bash
    - just build

commit-lint:
  stage: verify
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - curl -fsSL https://raw.githubusercontent.com/driftsys/git-std/main/install.sh | GIT_STD_INSTALL_DIR="$HOME/.local/bin" bash
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - just lint-commits "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
